[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
egui = "0.37"
eframe = { version = "0.37.0", features = ["persistence"] }
egui-phosphor = { git = "https://github.com/LeoLetellier/egui-phosphor", branch = "0.37", features = ["bold", "fill", "light", "thin"] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"

[package]
name = "raster_view"
version = "0.1.0"
authors = ["Leo Letellier <leo.letellier.6@gmail.com>"]
edition = "2024"
rust-version = "1.95"
description = "Tiny viewer for large GDAL rasters"
# documentation
readme = "README.md"
# homepage
repository = "https://github.com/LeoLetellier/RasterView"
license = "AGPL-3.0-or-later"
keywords = ["raster", "viewer", "gdal"]
# categories
build = "build.rs"

[dependencies]
rv_egui_widgets = { path = "crates/rv_egui_widgets" }
egui.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
anyhow = "1.0.104"
clap = "4.6.7"
# ndarray = { version = "0.17.2", features = ["rayon"] }
num-traits = "0.2.19"
ordered-float = "5.5.1"
poll-promise = "0.3.0"
quick_cache = "0.7.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gdal = { version = "0.19" }
gdal-sys = "0.12.0"
gdal-src = { version = "0.3.0", optional = true }
opener = { version = "0.9.0", features = ["reveal"] }

[features]
gdal-bundled = [
    "gdal-sys/bundled",
    "dep:gdal-src",
    "gdal-src/internal_drivers",
    "gdal-src/driver_sqlite",
    "gdal-src/driver_gpkg",
    "gdal-src/driver_netcdf",
]
gdal-bindgen = ["gdal/bindgen"]

[profile.release]
opt-level = 3 # default
lto = "fat" # link time optimizations
codegen-units = 1 # parallel compiling units
panic = "abort" # dont unwind panics
strip = true # remove symbols

# [profile.dev.package."*"]
# opt-level = 2 # optimize a bit deps on debug

[profile.native]
inherits = "release"

[profile.static]
inherits = "release"
